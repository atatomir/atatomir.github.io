<p>To export a screenshot from the position of the timeline playhead, select <strong>Export &gt; Export Frame</strong>.</p>
<img alt decoding="async" height="446" loading="lazy" src="images/export_frame.png" width="751">
<p>ScreenToVideo allows you to export a frame in the following file formats:</p>
<ul>
<li>Bitmap (.bmp)</li>
<li>Portable Network Graphics (.png)</li>
<li>GIF Image (.gif)</li>
<li>JPEG Image (.jpg)</li>
<li>TIFF Image (.tif)</li>
</ul>
