<p>Create a blank project.</p>
<ol>
<li>From the File menu select '<strong>New Blank'</strong> or press Ctrl+N</li>
<li>Select your preferred size for the project from preset sizes or manually enter required 'Width' and 'Height'</li>
<li>Finally, click '<strong>Create</strong>' button at the bottom</li>
</ol>
