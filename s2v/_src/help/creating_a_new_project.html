<p>Start creating a new project by selecting <a href="blank_project.htm"> <strong>File &gt; New Blank</strong></a> from the main menu. You should then see the <strong>Create New Project</strong> window, which lets you choose the size of the project you want to create.</p>
<p>Select  <a href="screen_recording_project.htm"> <strong>File &gt; New Screen Recording</strong></a> from the main menu to create a project from screen recording.</p>
