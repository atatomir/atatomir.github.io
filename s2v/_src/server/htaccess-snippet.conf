# Paste into the .htaccess in the web root of screentovideo.com (LiteSpeed/Apache), above any WordPress block.
# Fixes the PageSpeed items "Use efficient cache lifetimes", "Use a strong HSTS policy",
# "Mitigate clickjacking with XFO or CSP" and "Ensure proper origin isolation with COOP".

# --- Caching -----------------------------------------------------------------
# CSS, JS and the icon sprite are loaded with ?v=<hash>, so they can be cached for a year.
# Images aren't versioned, so they get 30 days. HTML stays short so updates show up quickly.
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css                 "access plus 1 year"
  ExpiresByType application/javascript   "access plus 1 year"
  ExpiresByType text/javascript          "access plus 1 year"
  ExpiresByType image/svg+xml            "access plus 1 year"
  ExpiresByType image/webp               "access plus 30 days"
  ExpiresByType image/png                "access plus 30 days"
  ExpiresByType image/jpeg               "access plus 30 days"
  ExpiresByType image/x-icon             "access plus 30 days"
  ExpiresByType text/html                "access plus 10 minutes"
</IfModule>

# --- Security headers --------------------------------------------------------
<IfModule mod_headers.c>
  # Always use HTTPS (only keep this once the whole site, including subdomains, works over HTTPS)
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  # Don't let other sites put these pages in a frame (clickjacking)
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Content-Security-Policy "frame-ancestors 'self'"
  # Origin isolation; "allow-popups" keeps the PayPro checkout and chat windows working
  Header always set Cross-Origin-Opener-Policy "same-origin-allow-popups"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
