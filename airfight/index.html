<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1622">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sky Ace">
<meta name="description" content="Sky Ace: a low-poly flight game in your browser. Fly over an island, chase rings, and soon dogfight.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Sky Ace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Menus float over the live 3D sky, so the UI is always a dark frosted-glass theme. */
  :root{
    color-scheme:dark;
    --glass:rgba(13,22,34,.6); --glass-2:rgba(255,255,255,.07); --glass-3:rgba(255,255,255,.12);
    --stroke:rgba(255,255,255,.14); --stroke-2:rgba(255,255,255,.24);
    --text:#ffffff; --muted:rgba(235,244,255,.74); --faint:rgba(235,244,255,.46);
    --grad:linear-gradient(135deg,#ffb340 0%,#ff5e62 100%);
    --sky:linear-gradient(135deg,#5fd0ff 0%,#4f7cff 100%);
    --accent:#ffb340; --bad:#ff6b7a; --good:#2ee59d; --warn:#ffd166;
    --r:24px; --r-sm:16px;
    --shadow:0 18px 50px rgba(0,10,25,.35); --glow:0 10px 30px rgba(255,120,80,.35);
    --display:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#7cc3f5;overscroll-behavior:none}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
       background:linear-gradient(180deg,#3d8fe0 0%,#a9dcff 60%,#cfe9f7 100%) fixed;min-height:100vh;min-height:100dvh;
       touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
  .hidden{display:none!important}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  button:disabled{opacity:.4;cursor:default}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}

  /* ---------- menu ---------- */
  .wrap{position:relative;z-index:2;width:100%;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
        padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .wrap::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
        background:linear-gradient(180deg,rgba(4,12,22,.5) 0%,rgba(4,12,22,.0) 30%,rgba(4,12,22,.08) 55%,rgba(4,12,22,.7) 100%)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-bottom:4px}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.2px}
  .brand img{width:36px;height:36px;border-radius:11px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .topr{display:flex;align-items:center;gap:8px}
  .chip{display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);
        background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
  .chip b{color:#fff;font-variant-numeric:tabular-nums}
  .iconbtn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;font-size:16px;
           background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .hero{padding:26px 4px 18px;text-shadow:0 4px 24px rgba(0,20,40,.35)}
  .title{font-family:var(--display);font-weight:700;font-size:clamp(46px,14vw,64px);line-height:.92;margin:0;letter-spacing:-.5px}
  .title span{background:linear-gradient(120deg,#ffe1a8 0%,#ffb340 40%,#ff5e62 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
              filter:drop-shadow(0 4px 18px rgba(255,120,80,.35))}
  .tagline{margin:10px 0 0;font-size:15px;font-weight:500;color:rgba(255,255,255,.92)}

  .card{position:relative;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);padding:18px;margin-bottom:14px;
        backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--shadow);animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .card:nth-of-type(2){animation-delay:.05s} .card:nth-of-type(3){animation-delay:.1s} .card:nth-of-type(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
  .card-h h3{margin:0;font-family:var(--display);font-weight:600;font-size:20px}
  .sub{font-size:12px;color:var(--faint);font-weight:600}

  .cta{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:20px;text-align:left;color:#2a0d05;
       background:var(--grad);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s,box-shadow .2s}
  .cta+.cta{margin-top:10px}
  .cta.alt{background:var(--sky);color:#041633;box-shadow:0 10px 30px rgba(79,124,255,.35),inset 0 1px 0 rgba(255,255,255,.45)}
  .cta:active{transform:scale(.97)}
  .cta-ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.35);flex:none}
  .cta-tx{flex:1;min-width:0}
  .cta-tx b{display:block;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
  .cta-tx small{font-size:13px;font-weight:600;opacity:.75}
  .cta-go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.12);font-size:22px;font-weight:700;flex:none}

  .paint{display:flex;align-items:center;gap:10px;margin-top:16px}
  .paint>span{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.8px;margin-right:auto}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:transform .15s,border-color .2s}
  .sw.on{border-color:#fff;transform:scale(1.12)}

  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-bottom:8px;border-radius:var(--r-sm);
          background:var(--glass-2);border:1px solid var(--stroke);text-align:left;cursor:pointer;font-weight:600;font-size:14px}
  .toggle:last-child{margin-bottom:0}
  .toggle small{display:block;color:var(--faint);font-size:12px;font-weight:500;margin-top:2px}
  .switch{position:relative;width:50px;height:30px;flex:none}
  .switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
  .switch i{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.2);transition:background .2s;pointer-events:none}
  .switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .switch input:checked+i{background:var(--good)}
  .switch input:checked+i::after{transform:translateX(20px)}
  .msg{margin-top:8px;font-size:13px;font-weight:600;color:var(--bad)}
  .msg:empty{display:none}

  .rules summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .rules summary::-webkit-details-marker{display:none}
  .rules summary::after{content:"+";font-size:22px;color:var(--muted);transition:transform .2s}
  .rules[open] summary::after{transform:rotate(45deg)}
  .rules ul{margin:12px 0 0;padding-left:18px;font-size:14px;line-height:1.6;color:var(--muted)}
  .rules b{color:#fff}
  .soon{display:flex;gap:8px;flex-wrap:wrap}
  .soon span{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-sm);border:1.5px dashed var(--stroke-2);font-size:14px;font-weight:600;color:var(--muted)}
  .soon i{font-style:normal;font-size:20px}

  /* ---------- in-flight HUD ---------- */
  .game{position:fixed;inset:0;z-index:3;overflow:hidden;touch-action:none;-webkit-touch-callout:none}
  #hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .glass{background:rgba(10,20,32,.45);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
  .htop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto;pointer-events:none;
        padding:calc(10px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
  .hbtn{pointer-events:auto;width:44px;height:44px;border-radius:15px;font-size:17px;display:grid;place-items:center;flex:none;transition:transform .12s}
  .hbtn:active{transform:scale(.92)}
  .compass{flex:1;height:44px;border-radius:15px;position:relative;overflow:hidden}
  .compass canvas{position:absolute;inset:0;width:100%;height:100%}
  .info{position:absolute;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translateX(-50%);height:34px;padding:0 14px;border-radius:999px;
        display:flex;align-items:center;gap:8px;font:600 15px var(--display);letter-spacing:.3px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
  .info:empty{display:none}
  .info .sep{opacity:.4}
  .warn{position:absolute;left:50%;top:32%;transform:translateX(-50%);padding:8px 16px;border-radius:12px;font:700 18px var(--display);letter-spacing:2px;
        color:#fff;background:rgba(255,60,80,.78);border:1px solid rgba(255,255,255,.4);box-shadow:0 0 30px rgba(255,60,80,.5);pointer-events:none;animation:blink .5s infinite}
  .warn.amber{background:rgba(255,170,40,.8);box-shadow:0 0 30px rgba(255,170,40,.45)}
  @keyframes blink{50%{opacity:.4}}
  .tape{position:absolute;top:44%;transform:translateY(-50%);min-width:74px;padding:7px 11px;border-radius:14px;pointer-events:none;text-align:center}
  .tape b{display:block;font:700 24px/1.05 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .tape small{display:block;font:600 10px var(--display);letter-spacing:1.4px;color:var(--muted)}
  .tape.l{left:max(12px,env(safe-area-inset-left))}
  .tape.r{right:max(12px,env(safe-area-inset-right))}
  .tape .vs{font:600 11px var(--display);margin-top:2px;color:var(--muted)}
  .tape.low b{color:#ff9aa4}
  .radar{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(64px + env(safe-area-inset-top));width:96px;height:96px;border-radius:50%;pointer-events:none;overflow:hidden}
  .radar canvas{width:100%;height:100%;display:block}

  /* throttle lever (right) and floating stick (left) */
  .thr{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:58px;height:min(200px,40vh);border-radius:20px;
       touch-action:none;cursor:ns-resize;padding:6px}
  .thr .track{position:relative;width:100%;height:100%;border-radius:14px;background:rgba(255,255,255,.1);overflow:hidden}
  .thr .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#ff5e62,#ffb340);border-radius:14px 14px 14px 14px;opacity:.85}
  .thr .knob{position:absolute;left:-2px;right:-2px;height:14px;margin-bottom:-7px;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .thr .lbl{position:absolute;left:0;right:0;top:8px;text-align:center;font:700 11px var(--display);letter-spacing:1px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);z-index:1}
  .thr .pct{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:700 14px var(--display);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);z-index:1;font-variant-numeric:tabular-nums}
  .stick{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;pointer-events:none;transition:opacity .2s}
  .stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.85);
           box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .stick.idle{opacity:.45}
  .stick.idle i{background:rgba(255,255,255,.35)}
  .stick::after{content:"";position:absolute;inset:22px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.25)}

  .toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-10px) scale(.9);max-width:calc(100% - 32px);width:max-content;text-align:center;
         padding:10px 18px;border-radius:999px;font:600 18px var(--display);color:#fff;pointer-events:none;opacity:0;transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.2,1.2);
         background:rgba(10,20,32,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
  .hint{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:min(440px,calc(100% - 180px));
        padding:12px 18px;border-radius:20px;font-size:14px;font-weight:600;line-height:1.7;text-align:center;pointer-events:none;transition:opacity .6s}
  .hint kbd{font:600 12px Inter,sans-serif;background:rgba(255,255,255,.18);border-radius:6px;padding:2px 7px}
  .hint.fade{opacity:0}
  @media (max-width:520px){ .hint{bottom:calc(240px + env(safe-area-inset-bottom));max-width:calc(100% - 40px)} }
  /* phones held sideways: tapes go up top, the radar sits bottom-centre like a cockpit instrument */
  @media (max-height:520px){
    .tape{top:calc(62px + env(safe-area-inset-top));transform:none;min-width:66px;padding:5px 9px}
    .tape b{font-size:20px}
    .radar{top:auto;right:auto;left:max(14px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:84px;height:84px}
    .toast{top:calc(104px + env(safe-area-inset-top))}
    .warn{top:64%}
    .hint{bottom:calc(176px + env(safe-area-inset-bottom))}
  }

  .ov{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;overflow:auto;
      padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 40%,rgba(4,12,22,.25),rgba(4,12,22,.65))}
  .sheet{width:100%;max-width:380px;padding:24px 18px 16px;border-radius:28px;text-align:center;background:rgba(13,22,34,.72);border:1px solid var(--stroke);
         backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:sheet .4s cubic-bezier(.2,.9,.2,1.1)}
  @keyframes sheet{from{transform:translateY(24px) scale(.96);opacity:0}}
  .sheet h2{margin:0 0 6px;font:700 32px var(--display)}
  .sheet p{margin:0 0 14px;font-size:14px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
  .stats div{padding:10px 6px;border-radius:16px;background:var(--glass-2);border:1px solid var(--stroke);animation:rise .4s both}
  .stats div:nth-child(2){animation-delay:.08s} .stats div:nth-child(3){animation-delay:.16s}
  .stats b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
  .stats small{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
  .stats .rec b{color:var(--warn)}
  .btns{display:flex;flex-direction:column;gap:8px}
  .btns button{height:52px;border-radius:16px;font:600 17px var(--display);background:var(--glass-3);border:1px solid var(--stroke);transition:transform .12s}
  .btns button:active{transform:scale(.97)}
  .btns button.primary{height:58px;font-size:19px;background:var(--grad);color:#2a0d05;border:0;box-shadow:0 10px 26px rgba(255,120,80,.35)}
  .btns button.ghost{background:transparent;border-color:transparent;height:44px;font-size:15px;color:var(--muted)}
  .sheet .toggle{margin:0 0 14px}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="wrap" id="pages">
  <header class="top">
    <a class="brand" href="../games/"><img src="favicon.svg" alt="">Sky Ace</a>
    <div class="topr">
      <div class="chip" title="Best Ring Run time">🏆 <b id="best">–</b></div>
      <button class="iconbtn" id="sound" aria-label="Sound">🔇</button>
    </div>
  </header>

  <section id="menu">
    <div class="hero">
      <h1 class="title">Sky<br><span>Ace</span></h1>
      <p class="tagline">Take the stick. Bank, loop and thread the rings.</p>
    </div>

    <div class="card">
      <button class="cta" id="playRings"><span class="cta-ic">🎯</span><span class="cta-tx"><b>Ring Run</b><small>Thread 14 rings against the clock</small></span><span class="cta-go">›</span></button>
      <button class="cta alt" id="playFree"><span class="cta-ic">🛩️</span><span class="cta-tx"><b>Free flight</b><small>Explore the island, no rules</small></span><span class="cta-go">›</span></button>
      <div class="paint"><span>Paint</span><div id="swatches" style="display:flex;gap:10px"></div></div>
    </div>

    <div class="card">
      <div class="card-h"><h3>Controls</h3><span class="sub" id="ctlKind"></span></div>
      <label class="toggle"><span>Flight assist<small>Wings level themselves when you let go</small></span>
        <span class="switch"><input type="checkbox" id="optAssist"><i></i></span></label>
      <label class="toggle"><span>Pilot-style pitch<small>Pull back (down) to climb, like a real stick</small></span>
        <span class="switch"><input type="checkbox" id="optPilot"><i></i></span></label>
      <label class="toggle" id="tiltRow"><span>Tilt to steer<small>Bank and climb by tilting your phone</small></span>
        <span class="switch"><input type="checkbox" id="optTilt"><i></i></span></label>
      <div class="msg" id="tiltMsg"></div>
    </div>

    <details class="card rules"><summary>How to fly</summary>
      <ul id="howto"></ul>
    </details>

    <div class="card">
      <div class="card-h"><h3>Coming next</h3><span class="sub">In the hangar</span></div>
      <div class="soon"><span><i>⚔️</i>Dogfight the AI</span><span><i>🌐</i>Online battles</span></div>
    </div>
  </section>
</div>

<div class="game hidden" id="game">
  <canvas id="hud"></canvas>
  <div class="htop">
    <button class="hbtn glass" id="pauseBtn" aria-label="Pause">⏸</button>
    <div class="compass glass"><canvas id="compass"></canvas></div>
    <button class="hbtn glass" id="camBtn" aria-label="Change camera">🎥</button>
  </div>
  <div class="info glass" id="info"></div>
  <div class="radar glass"><canvas id="radar" width="192" height="192"></canvas></div>
  <div class="tape l glass" id="spdTape"><small>SPEED</small><b id="spd">0</b><small>KM/H</small><div class="vs" id="gld">1.0 G</div></div>
  <div class="tape r glass" id="altTape"><small>ALT</small><b id="alt">0</b><small>M</small><div class="vs" id="vs">↕ 0</div></div>
  <div class="warn hidden" id="warn"></div>
  <div class="stick idle hidden" id="stick"><i id="knob"></i></div>
  <div class="thr glass" id="thr"><div class="track" id="thrTrack"><span class="lbl">THR</span><div class="fill" id="thrFill"></div><div class="knob" id="thrKnob"></div><span class="pct" id="thrPct"></span></div></div>
  <div class="toast" id="toast"></div>
  <div class="hint glass hidden" id="hint"></div>
  <div class="ov hidden" id="ov">
    <div class="sheet">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div class="stats hidden" id="ovStats"></div>
      <div id="ovExtra"></div>
      <div class="btns" id="ovBtns"></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- small helpers ----------
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b - a) * t;
const smooth = (a,b,x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const fmtTime = s => { const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); };

{ let h = 0; for (let x = SPAWN.pos.x - 2600; x <= SPAWN.pos.x + 300; x += 25) for (const o of [-80, 0, 80]) h = Math.max(h, floorAt(x, SPAWN.pos.z + o)); SPAWN.pos.y = Math.max(220, h + 140); }
function buildCourse(){
  const r = rng(2024), list = [];
  let x = SPAWN.pos.x, z = SPAWN.pos.z, y = SPAWN.pos.y, a = Math.PI;   // direction (cos a, sin a) = (-1, 0): west
  for (let i = 0; i < RING_N; i++){
    const d = (i ? 560 : 650) + r() * 160, rad = Math.hypot(x, z);
    // wander, but curl back towards a loop around the island
    let turn = (r() - .5) * 1.1;
    const toC = Math.atan2(-z, -x); let diff = Math.atan2(Math.sin(toC - a), Math.cos(toC - a));
    if (rad > 2900) turn += diff * .35; else if (rad < 1300) turn -= diff * .25;
    turn += .18;                                 // overall a counter-clockwise loop
    if (i) a += clamp(turn, -.75, .75);          // no hairpins: at most ~43 degrees between legs
    const nx = x + Math.cos(a) * d, nz = z + Math.sin(a) * d;
    // clear the whole approach corridor (and a little past the ring) with room to spare
    let hmax = 0; for (let s = 0; s <= 1.3; s += .03) for (const o of [-90, -45, 0, 45, 90]) hmax = Math.max(hmax, floorAt(lerp(x, nx, s) - Math.sin(a) * o, lerp(z, nz, s) + Math.cos(a) * o));

    if (i === 0) ny = Math.max(SPAWN.pos.y - 40, hmax + 60);
    x = nx; z = nz; y = Math.min(ny, 1500);

}
const COURSE = buildCourse();

    const a = r() * 6.3, d = 800 + r() * 3200, x = Math.cos(a) * d, z = Math.sin(a) * d;

// tilt: gravity direction in screen space from beta/gamma, so it works in portrait and landscape
function onTilt(e){
  if (e.beta == null || e.gamma == null) return;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  const dx = Math.cos(b) * Math.sin(g), dy = -Math.sin(b), dz = -Math.cos(b) * Math.cos(g);
  const ang = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * Math.PI / 180;
  const sx = dx * Math.cos(ang) - dy * Math.sin(ang), sy = dx * Math.sin(ang) + dy * Math.cos(ang);
  ctl.tilt.roll = Math.asin(clamp(sx, -1, 1));
  ctl.tilt.phi = Math.atan2(-sy, -dz);
  if (ctl.tilt.n === null) ctl.tilt.n = ctl.tilt.phi;
  ctl.tilt.ok = true;
}

  $('tiltMsg').textContent = '';
  if (!on){ SET.tilt = false; removeEventListener('deviceorientation', onTilt); return; }
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
      const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') throw new Error('denied');
    }
    if (typeof DeviceOrientationEvent === 'undefined') throw new Error('none');
    addEventListener('deviceorientation', onTilt); SET.tilt = true; ctl.tilt.n = null;
  } catch { SET.tilt = false; $('optTilt').checked = false; $('tiltMsg').textContent = 'Motion sensors are not available, so tilt steering stays off.'; }
}

const curve = v => Math.sign(v) * Math.pow(Math.abs(v), 1.4);
function readInput(dt){
  const p = G.player, pilot = SET.pilot ? -1 : 1;
  let kp = 0, kr = 0, ky = 0;
  if (K.KeyW || K.ArrowUp) kp += 1;
  if (K.KeyS || K.ArrowDown) kp -= 1;
  if (K.KeyD || K.ArrowRight) kr += 1;
  if (K.KeyA || K.ArrowLeft) kr -= 1;
  if (K.KeyE) ky += 1;
  if (K.KeyQ) ky -= 1;
  if (K.ShiftLeft || K.ShiftRight || K.KeyR || K.Equal) p.throttle = clamp(p.throttle + dt * .7, 0, 1);
  if (K.ControlLeft || K.ControlRight || K.KeyF || K.Minus) p.throttle = clamp(p.throttle - dt * .7, 0, 1);
  let tp = kp * pilot, tr = kr;
  tp += curve(-ctl.stick.y) * pilot; tr += curve(ctl.stick.x);
  if (SET.tilt && ctl.tilt.ok && ctl.tilt.n !== null){
    const dz = (v, z) => Math.abs(v) < z ? 0 : v - Math.sign(v) * z;
    tr += clamp(dz(ctl.tilt.roll, .05) / .42, -1, 1);
    tp += clamp(dz(ctl.tilt.n - ctl.tilt.phi, .05) / .38, -1, 1);

    tr += ax(0); tp += -ax(1) * pilot; ky += ax(2) * .8;
    const rt = gp.buttons[7]?.value || 0, lt = gp.buttons[6]?.value || 0;
    p.throttle = clamp(p.throttle + (rt - lt) * dt * .8, 0, 1);
    if (gp.buttons[9]?.pressed && !ctl.pad.start && G.state === 'fly') pause();

}

function drawCompass(){

      if (y < floorAt(x, z) + 6){ w = 'PULL UP'; break; }
    }
    if (!w && !p.onGround && (p.stall > .05 || p.alpha > AC.aStall - .035)) w = 'STALL';
    if (!w && Math.hypot(p.pos.x, p.pos.z) > 7000){ w = 'TURN BACK'; amber = true; }
  }
  const we = $('warn');
  if (w !== lastWarn){ we.textContent = w; we.classList.toggle('hidden', !w); lastWarn = w; }
  we.classList.toggle('amber', amber);
  beepT -= dt;
  if (w && beepT <= 0 && !amber){ sfx(w === 'STALL' ? 'stall' : 'pull'); beepT = w === 'STALL' ? .35 : .6; }
  if (toastT > 0 && (toastT -= dt) <= 0) toastEl.classList.remove('on');
  if (G.hintT > 0 && (G.hintT -= dt) <= 0) hideHint();
}

// ---------- camera ----------
const camPos = new V3(), camLook = new V3();
function camModel(){ const m = G.player.m; m.canopy.visible = G.cam === 0; m.prop.visible = G.cam === 0; }
function toggleCam(){ G.cam = (G.cam + 1) % 2; camModel(); toast(G.cam ? '🎥 Cockpit view' : '🎥 Chase view', 1); }
$('camBtn').onclick = toggleCam;
function updateCamera(dt, snap = false){
  if (G.state === 'attract'){
    const p = G.ai; G.orbit += dt * .09;
    const off = new V3(Math.sin(G.orbit) * 26, 6 + Math.sin(G.orbit * .7) * 4, Math.cos(G.orbit) * 26);
    camera.position.copy(p.pos).add(off); camera.up.copy(UP); camera.lookAt(p.pos);
    camera.fov = 50; camera.updateProjectionMatrix();
    return;
  }
  const p = G.player, { f, u } = p.axes();
  if (G.cam === 1 && p.alive){
    camera.position.copy(p.pos).addScaledVector(u, 1.45).addScaledVector(f, -.6);
    camera.quaternion.copy(p.q);
    camera.fov = 72;
  } else {
    const upB = _u.copy(UP).lerp(u, .55).normalize();
    const far = camera.aspect < 1 ? 1.4 : 1;   // portrait screens are narrow, so pull the chase camera back
    const want = _a.copy(p.pos).addScaledVector(f, -15.5 * far).addScaledVector(upB, 4.2 * far);
    if (snap) camPos.copy(want); else camPos.lerp(want, damp(p.alive ? 7 : 1.2, dt));
    // keep the camera out of the ground
    camPos.y = Math.max(camPos.y, floorAt(camPos.x, camPos.z) + 2);
    const look = _r.copy(p.pos).addScaledVector(f, p.alive ? 24 : 0).addScaledVector(u, p.alive ? 1.5 : 0);
    if (snap) camLook.copy(look); else camLook.lerp(look, damp(p.alive ? 12 : 2, dt));
    camera.position.copy(camPos);
    camera.up.copy(UP).lerp(u, p.alive ? .38 : 0).normalize();
    camera.lookAt(camLook);
    camera.fov = lerp(camera.fov, 60 + clamp((p.speed - 60) * .18, -4, 12), damp(3, dt));
  }
  camera.updateProjectionMatrix();
}

// ---------- flow ----------
const pagesEl = $('pages');
function showMenu(){
  G.mode = 'menu'; G.state = 'attract';
  gameEl.classList.add('hidden'); pagesEl.classList.remove('hidden'); $('ov').classList.add('hidden');
  G.player.m.g.visible = false; G.ai.m.g.visible = true; trails.forEach(t => t.clear());
  rings.forEach(r => r.m.visible = false);
  engine(false); window.scrollTo(0, 0);
}
function startFlight(mode){
  G.mode = mode; G.state = 'fly'; G.t = 0; G.penalty = 0; G.crashes = 0; G.auto = false; G.next = 0; G.lastSide = -1; G.cam = 0;
  G.player.setPaint(SET.paint); camModel();
  G.player.reset(SPAWN.pos, SPAWN.heading, 78);
  G.ai.m.g.visible = false; aiTrails.forEach(t => t.clear()); trails.forEach(t => t.clear());
  pagesEl.classList.add('hidden'); gameEl.classList.remove('hidden'); $('ov').classList.add('hidden');
  rings.forEach((r, i) => { r.m.visible = mode === 'rings'; r.pop = 0; r.m.scale.setScalar(1); });
  styleRings();
  ctl.tilt.n = null; ctl.stick = { id:null, ox:0, oy:0, x:0, y:0 };
  $('stick').classList.toggle('hidden', !touchUI); idleStick();
  const h = $('hint');
  h.innerHTML = touchUI
    ? (SET.tilt ? 'Tilt to bank and climb · slide <b>THR</b> for speed' : 'Drag anywhere to steer · slide <b>THR</b> for speed') + (innerHeight > innerWidth ? '<br><small style="color:var(--muted)">Turn your phone sideways for a wider view</small>' : '')
    : `<kbd>W</kbd><kbd>S</kbd> ${SET.pilot ? 'dive / climb' : 'climb / dive'} · <kbd>A</kbd><kbd>D</kbd> bank · <kbd>Q</kbd><kbd>E</kbd> rudder<br><kbd>Shift</kbd><kbd>Ctrl</kbd> throttle · <kbd>C</kbd> camera · <kbd>Esc</kbd> pause`;
  h.classList.remove('hidden', 'fade'); G.hintT = 7;
  toast(mode === 'rings' ? '🎯 Fly through the yellow ring' : '🛩️ Enjoy the flight', 2.2);
  updateCamera(0, true);
  if (history.state?.flying !== true) history.pushState({ flying:true }, '');
}
addEventListener('popstate', () => { if (G.state !== 'attract') showMenu(); });
function styleRings(){
  rings.forEach((r, i) => {
    if (i < G.next){ if (!r.pop) r.m.visible = false; return; }
    r.m.visible = G.mode === 'rings';
    r.m.material = i === G.next ? (i === RING_N - 1 ? ringMats.fin : ringMats.next) : i === G.next + 1 ? (i === RING_N - 1 ? ringMats.fin : ringMats.soon) : ringMats.far;
    r.glow.visible = i === G.next;
  });
}
function sheet(title, text, btns, stats = null, extra = ''){
  $('ovTitle').textContent = title; $('ovText').innerHTML = text;
  const st = $('ovStats'); st.classList.toggle('hidden', !stats); st.innerHTML = stats || '';
  $('ovExtra').innerHTML = extra; toastEl.classList.remove('on'); toastT = 0;
  const b = $('ovBtns'); b.innerHTML = '';
  for (const [label, fn, cls] of btns){ const e = document.createElement('button'); e.textContent = label; if (cls) e.className = cls; if (fn) e.onclick = fn; b.appendChild(e); }
  $('ov').classList.remove('hidden');
}
function pause(){
  if (G.state !== 'fly') return;
  G.state = 'paused'; engine(false);
  sheet('Paused', G.mode === 'rings' ? `Ring ${Math.min(G.next + 1, RING_N)} of ${RING_N} · ${fmtTime(G.t + G.penalty)}` : 'Take a breath, pilot.', [
    ['▶ Resume', resume, 'primary'],
    ['↺ Restart', () => startFlight(G.mode)],
    [SND.on ? '🔊 Sound on' : '🔇 Sound off', null],
    ['Main menu', () => history.state?.flying ? history.back() : showMenu(), 'ghost'],
  ]);
  const snd = $('ovBtns').children[2]; snd.onclick = () => { SND.on = !SND.on; soundUI(); snd.textContent = SND.on ? '🔊 Sound on' : '🔇 Sound off'; };
}
function resume(){ if (G.state !== 'paused') return; $('ov').classList.add('hidden'); G.state = 'fly'; ctl.tilt.n = null; }
$('pauseBtn').onclick = pause;

function crash(){
  const p = G.player; if (!p.alive) return;
  p.alive = false; p.m.g.visible = false;
  explode(p.pos); boomSfx(); buzz([60, 40, 140]);
  G.state = 'crashed'; G.respawnAt = 2.6;
  $('warn').classList.add('hidden'); lastWarn = '';
  if (G.mode === 'rings'){ G.penalty += 5; G.crashes++; toast('💥 Crashed! +5 s', 2.2); }
  else toast('💥 Crashed! Respawning…', 2.2);
}
const headingTo = (from, to) => Math.atan2(-(to.x - from.x), -(to.z - from.z));
function respawn(){
  const p = G.player;
  if (G.mode === 'rings'){
    const from = G.next ? rings[G.next - 1].c : SPAWN.pos, to = rings[Math.min(G.next, RING_N - 1)].c;
    const at = from.clone(); at.y = Math.max(at.y, floorAt(at.x, at.z) + 90);
    p.reset(at, headingTo(at, to), 75);
    G.lastSide = rings[G.next] ? Math.sign(at.clone().sub(rings[G.next].c).dot(rings[G.next].n)) || -1 : -1;
  } else p.reset(SPAWN.pos, SPAWN.heading, 78);
  trails.forEach(t => t.clear()); ctl.tilt.n = null;
  G.state = 'fly'; updateCamera(0, true);
}
function checkRings(){
  const r = rings[G.next]; if (!r) return;
  const rel = _a.copy(G.player.pos).sub(r.c), side = rel.dot(r.n);
  if (G.lastSide < 0 && side >= 0){
    const lat = rel.addScaledVector(r.n, -side).length();
    if (lat < RING_R){
      r.pop = 1; G.next++; sfx('ring'); buzz(25); styleRings();
      if (G.next >= RING_N) return finishRun();
      toast(G.next === RING_N - 1 ? '🏁 Last ring!' : `🎯 ${G.next} / ${RING_N}`, 1);
      const nr = rings[G.next]; G.lastSide = Math.sign(_a.copy(G.player.pos).sub(nr.c).dot(nr.n)) || -1;
      return;
    }
    if (lat < RING_R * 5){ toast('Missed! Loop back around', 1.4); sfx('miss'); }
  }
  G.lastSide = side;
}
function finishRun(){
  G.state = 'done';
  const total = G.t + G.penalty, rec = !best || total < best;
  if (rec){ best = total; store.set('flight-best-rings', String(best)); showBest(); }
  sfx('win'); buzz([30, 40, 30, 40, 80]);
  $('warn').classList.add('hidden'); lastWarn = '';
  setTimeout(() => sheet(rec ? '🏆 New record!' : '🏁 Course complete', rec ? 'Fastest run yet on the island circuit.' : `Your best is ${fmtTime(best)}. Go again?`, [
    ['↺ Fly again', () => startFlight('rings'), 'primary'],
    ['🛩️ Free flight', () => startFlight('free')],
    ['Main menu', () => history.state?.flying ? history.back() : showMenu(), 'ghost'],
  ], `<div class="${rec ? 'rec' : ''}"><b>${fmtTime(total)}</b><small>Time</small></div><div><b>${best ? fmtTime(best) : '–'}</b><small>Best</small></div><div><b>${G.crashes}</b><small>Crashes</small></div>`), 700);
}

// ---------- main loop ----------
const STEP = 1 / 120, _tip = new V3(), _tgt = new V3();
function emitTrails(p, list){
  if (!p.alive) return;
  const a = Math.max(smooth(2.6, 5.5, Math.abs(p.gload || 0)) * smooth(40, 70, p.speed), smooth(105, 125, p.speed) * .5);
  p.m.tips.forEach((t, i) => list[i].push(_tip.copy(t).applyQuaternion(p.q).add(p.pos), a));
}
function simAttract(dt){
  const p = G.ai;
  if (Math.hypot(G.aiTarget.x - p.pos.x, G.aiTarget.z - p.pos.z) < 500) pickAiTarget();
  for (let t = dt; t > 1e-6; t -= STEP){ const h = Math.min(STEP, t); steerTo(p, G.aiTarget, h, .78); if (stepPlane(p, h, AID_AI)) p.pos.y = -999; }
  if (p.pos.y < floorAt(p.pos.x, p.pos.z) + 5){ p.reset(new V3(0, 700, 0), Math.random() * 6.3, 85); pickAiTarget(); aiTrails.forEach(t => t.clear()); }
  animatePlane(p, dt); emitTrails(p, aiTrails);
}
function simPlayer(dt){
  const p = G.player;
  if (G.state === 'fly'){
    const r = Math.hypot(p.pos.x, p.pos.z);
    if (r > 8600 && !G.auto){ G.auto = true; toast('🧭 Autopilot is taking you back', 2.4); }
    if (G.auto && r < 6400) G.auto = false;
    if (G.auto) { _tgt.set(0, Math.max(p.pos.y, 500), 0); }
    else readInput(dt);
    for (let t = dt; t > 1e-6; t -= STEP){
      const h = Math.min(STEP, t);
      if (G.auto) steerTo(p, _tgt, h, .8);
      if (stepPlane(p, h, G.auto ? AID_AI : SET.assist ? AID_FULL : AID_NONE)){ crash(); break; }
      if (p.touch){
        const v = p.touch.vy, where = p.touch.strip ? 'on the airstrip' : 'off-field';
        toast(v < 1.5 ? `🛬 Butter! ${where} · ${v.toFixed(1)} m/s` : v < 3.5 ? `🛬 Nice landing ${where} · ${v.toFixed(1)} m/s` : `🛬 Firm one… ${v.toFixed(1)} m/s`, 2.4);
        sfx('ring'); buzz(30); p.touch = null;
      }
      if (G.mode === 'rings'){ checkRings(); if (G.state !== 'fly') break; }
    }
    if (G.mode === 'rings' && G.state === 'fly') G.t += dt;
  } else if (G.state === 'crashed'){
    if ((G.respawnAt -= dt) <= 0) respawn();
  } else if (G.state === 'done'){
    // victory lap: the autopilot climbs away gently behind the results sheet
    const { f } = p.axes();
    _tgt.copy(p.pos).addScaledVector(f, 900); _tgt.y = Math.max(p.pos.y + 120, floorAt(_tgt.x, _tgt.z) + 300);
    for (let t = dt; t > 1e-6; t -= STEP){ const h = Math.min(STEP, t); steerTo(p, _tgt, h, .7); stepPlane(p, h, AID_AI); }
  }
  if (p.alive){ animatePlane(p, dt); emitTrails(p, trails); }
}
let last = performance.now(), pulse = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
  const running = G.state !== 'paused';
  if (G.state === 'attract') simAttract(dt);
  else if (running) simPlayer(dt);
  if (running){
    updateBoom(dt);
    const cam = camera;
    trails.forEach(t => t.update(dt, cam)); aiTrails.forEach(t => t.update(dt, cam));
    pulse += dt;
    rings.forEach(r => {
      if (r.pop > 0){ r.pop -= dt * 2.2; r.m.scale.setScalar(1 + (1 - Math.max(r.pop, 0)) * .8); if (r.pop <= 0){ r.pop = 0; r.m.visible = false; r.m.scale.setScalar(1); } }
    });
    if (rings[G.next]) rings[G.next].glow.material.opacity = .08 + Math.sin(pulse * 4) * .05;
  }
  updateCamera(running ? dt : 0);
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
  if (G.state !== 'attract'){
    drawHud(); drawCompass(); drawRadar(); updateHudDom(dt);
    engine(G.state === 'fly' || G.state === 'done', G.player.throttle, G.player.alive ? G.player.speed : 0);
  }
}

// ---------- menu wiring ----------
const sw = $('swatches');
PAINTS.forEach((pt, i) => {
  const b = document.createElement('button'); b.className = 'sw'; b.style.background = pt.css; b.title = pt.name; b.setAttribute('aria-label', pt.name + ' paint');
  b.onclick = () => { SET.paint = i; saveSet(); G.ai.setPaint(i); [...sw.children].forEach((c, k) => c.classList.toggle('on', k === i)); };
  sw.appendChild(b);
});
sw.children[SET.paint]?.classList.add('on');
G.ai.setPaint(SET.paint);
$('optAssist').checked = SET.assist; $('optAssist').onchange = e => { SET.assist = e.target.checked; saveSet(); };
$('optPilot').checked = SET.pilot; $('optPilot').onchange = e => { SET.pilot = e.target.checked; saveSet(); };
$('tiltRow').classList.toggle('hidden', !touchUI);
$('optTilt').checked = false; $('optTilt').onchange = e => enableTilt(e.target.checked);
$('ctlKind').textContent = touchUI ? 'Touch' : 'Keyboard · gamepad';
$('howto').innerHTML = (touchUI ? [
  '<b>Drag anywhere on the screen</b> to fly (the stick sits bottom-centre): left / right banks, up / down climbs and dives.',
  '<b>Slide the THR lever</b> on the right to set your speed.',
] : [
  '<b>W / S</b> or <b>↑ / ↓</b> climb and dive, <b>A / D</b> or <b>← / →</b> bank, <b>Q / E</b> rudder.',
  '<b>Shift / Ctrl</b> (or <b>R / F</b>) throttle up and down. A gamepad works too.',
  '<b>C</b> switches camera, <b>Esc</b> pauses.',
]).concat([
  '<b>Bank to turn.</b> Tip the wings and the plane curves that way; pull while banked for a tighter turn.',
  'Climbing costs speed, diving gains it. Too slow (about <b>100 km/h</b>) and the wing <b>stalls</b>: lower the nose to recover.',
  '<b>Landing:</b> line up with the airstrip, slow to ~150–200 km/h, sink gently with wings level, then pull the throttle to zero to brake. Throttle up to take off again.',
  '<b>Ring Run:</b> fly through the yellow ring, follow the arrow to the next one. A crash costs 5 seconds.',
]).map(s => `<li>${s}</li>`).join('');
$('playRings').onclick = () => startFlight('rings');
$('playFree').onclick = () => startFlight('free');

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  DPR = Math.min(devicePixelRatio || 1, 2); hud.width = Math.round(w * DPR); hud.height = Math.round(h * DPR);
}
addEventListener('resize', resize);
resize();
G.crashes = 0;
window.__sky = { G, startFlight, showMenu, rings, COURSE, ground, floorAt, AC, AID_FULL, AID_NONE, AID_AI, RUN, steerTo, stepPlane, checkRings, pause };
requestAnimationFrame(frame);
</script>
</body>
