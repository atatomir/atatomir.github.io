  <path d="M29 31 a1.6 1.6 0 1 1 3.2 0 a3.6 3.6 0 1 1 -7.2 0 a5.8 5.8 0 1 1 11.6 0 a8 8 0 1 1 -16 0 a10.2 10.2 0 1 1 20.4 0"
