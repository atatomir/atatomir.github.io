  <path d="M51.5 34.5 Q54 37 56.5 34.5" stroke="#1a1410" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <circle cx="57.6" cy="32.5" r="1.4" fill="#ff8fa3"/>
